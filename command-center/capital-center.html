<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Capital Center — Grupo Maurício</title><style>:root{--bg:#07111f;--panel:#0d1c2f;--line:rgba(255,255,255,.09);--text:#f6f8fb;--muted:#93a4ba;--gold:#d6b36a;--green:#45d49a;--red:#ff6b6b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 20% 0%,#102846 0,var(--bg) 34%);color:var(--text);min-height:100vh}button,input,textarea,select{font:inherit}.wrap{max-width:1240px;margin:auto;padding:28px 20px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:30px}.back{color:var(--muted);text-decoration:none}.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{font-size:clamp(34px,5vw,58px);margin:8px 0}.lead{color:var(--muted);max-width:760px;line-height:1.6}.toolbar{display:flex;gap:12px;justify-content:space-between;align-items:center;margin:28px 0;flex-wrap:wrap}.search{flex:1;min-width:250px;padding:13px 15px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text)}.btn{border:1px solid var(--line);color:var(--text);background:rgba(255,255,255,.06);border-radius:12px;padding:11px 15px;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--gold),#a9843d);color:#08111d;border-color:transparent;font-weight:800}.btn.danger{color:#ffdada;border-color:rgba(255,107,107,.3)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border-radius:20px;padding:22px}.company h2{font-size:24px;margin:12px 0 8px}.company p{color:var(--muted);line-height:1.55;min-height:48px}.tags{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tag{font-size:12px;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line)}.actions{display:flex;gap:9px;margin-top:18px}.state{padding:50px 20px;text-align:center;color:var(--muted)}dialog{width:min(620px,calc(100% - 28px));border:1px solid var(--line);border-radius:22px;background:#0b192b;color:var(--text);padding:0}dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(5px)}.modal{padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center}.form{display:grid;gap:14px;margin-top:20px}.field{display:grid;gap:7px}.field label{color:var(--muted);font-size:13px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.05);color:var(--text);padding:12px}.field textarea{min-height:110px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}.notice{display:none;padding:12px 14px;border-radius:12px;margin:18px 0}.notice.show{display:block}.notice.ok{background:rgba(69,212,154,.1);color:#baf4d9}.notice.error{background:rgba(255,107,107,.1);color:#ffd0d0}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.top .btn{white-space:nowrap}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="./index.html">← Command Center</a><button class="btn" id="logoutBtn">Sair</button></div><div class="eyebrow">Patrimônio estratégico</div><h1>Capital Center</h1><p class="lead">Cadastre e organize as empresas que compõem o Grupo Maurício. Os dados desta tela são carregados diretamente do Supabase.</p><div id="notice" class="notice"></div><div class="toolbar"><input class="search" id="searchInput" placeholder="Buscar empresa, segmento ou razão social"><button class="btn primary" id="newCompanyBtn">+ Nova empresa</button></div><section id="companyGrid" class="grid"><div class="card state">Carregando empresas...</div></section></main><dialog id="companyDialog"><form class="modal" id="companyForm"><div class="modal-head"><div><div class="eyebrow">Capital Center</div><h2 id="dialogTitle">Nova empresa</h2></div><button type="button" class="btn" id="closeDialogBtn">✕</button></div><input type="hidden" id="companyId"><div class="form"><div class="field"><label for="name">Nome da empresa</label><input id="name" required maxlength="120"></div><div class="field"><label for="legalName">Razão social</label><input id="legalName" maxlength="180"></div><div class="field"><label for="documentNumber">CNPJ ou documento</label><input id="documentNumber" maxlength="30"></div><div class="field"><label for="description">Descrição</label><textarea id="description" maxlength="700"></textarea></div><div class="field"><label for="segments">Segmentos, separados por vírgula</label><input id="segments" placeholder="Marketing, Tecnologia, IA"></div><div class="field"><label for="status">Status</label><select id="status"><option value="active">Ativa</option><option value="draft">Em estruturação</option><option value="paused">Pausada</option><option value="archived">Arquivada</option></select></div><div class="form-actions"><button type="button" class="btn" id="cancelBtn">Cancelar</button><button class="btn primary" type="submit">Salvar empresa</button></div></div></form></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./auth/config.js"></script><script src="./auth/session.js"></script><script src="./capital-center.js"></script></body></html>
